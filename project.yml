name: Slam
options:
  bundleIdPrefix: com.kyoahb
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
packages:
  SlamCore:
    path: Packages/SlamCore
targets:
  Slam:
    type: application
    platform: iOS
    sources:
      - path: Slam
      - path: Activity
    dependencies:
      - package: SlamCore
      - target: SlamWidgets
      - target: SlamWatch
    entitlements:
      path: Slam/Slam.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: Slam/Info.plist
      properties:
        CFBundleDisplayName: Slam
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        LSSupportsOpeningDocumentsInPlace: true
        NSCameraUsageDescription: Take photos for your workouts.
        NSHealthShareUsageDescription: Links your Apple Watch workouts to the cardio you log.
        NSHealthUpdateUsageDescription: Slam only reads your workouts and never writes to Health.
        NSSupportsLiveActivities: true
        BGTaskSchedulerPermittedIdentifiers:
          - com.kyoahb.slam.sync
        UIBackgroundModes:
          - audio
          - fetch
        CFBundleURLTypes:
          - CFBundleURLName: com.kyoahb.slam
            CFBundleURLSchemes:
              - slam
        UIFileSharingEnabled: true
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kyoahb.slam
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: true
  SlamWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Activity
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Slam
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kyoahb.slam.widgets
        TARGETED_DEVICE_FAMILY: "1"
  SlamWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Watch
    dependencies:
      - package: SlamCore
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Slam
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.kyoahb.slam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kyoahb.slam.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: true
schemes:
  Slam:
    build:
      targets:
        Slam: all
    archive:
      config: Release
