name: TestFlight

on:
  workflow_dispatch:
  schedule:
    # TestFlight builds expire after 90 days.
    - cron: "0 6 1 */2 *"

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      TEAMID: ${{ secrets.TEAMID }}
      KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
      ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Generate project
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate

      - name: API key
        env:
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
        run: |
          mkdir -p build
          printf '%s\n' "$FASTLANE_KEY" > build/AuthKey.p8

      # Each run's Mac makes a development certificate and then throws its key away, and Apple allows only a few.
      # Revoke the ones earlier runs left (named "Created via API"); distribution signing is not touched.
      - name: Revoke old CI certificates
        run: |
          python3 -m venv "$RUNNER_TEMP/asc" && "$RUNNER_TEMP/asc/bin/pip" install -q 'pyjwt[crypto]==2.10.1'
          "$RUNNER_TEMP/asc/bin/python" - <<'PY'
          import json, os, time, urllib.request
          import jwt
          now = int(time.time())
          token = jwt.encode({"iss": os.environ["ISSUER_ID"], "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"},
                             open("build/AuthKey.p8").read(), algorithm="ES256", headers={"kid": os.environ["KEY_ID"], "typ": "JWT"})
          def call(method, path):
              req = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/" + path, method=method,
                                           headers={"Authorization": "Bearer " + token})
              with urllib.request.urlopen(req) as r:
                  body = r.read()
              return json.loads(body) if body else None
          certs = call("GET", "certificates?limit=200&filter[certificateType]=DEVELOPMENT,IOS_DEVELOPMENT")["data"]
          old = [c for c in certs if "Created via API" in (c["attributes"].get("name", "") + c["attributes"].get("displayName", ""))]
          print(f"{len(certs)} development certificates, {len(old)} made by earlier runs")
          for c in certs:
              a = c["attributes"]
              print(" ", a.get("certificateType"), a.get("name"), "|", a.get("displayName"), "| expires", a.get("expirationDate", "")[:10])
          for c in old:
              call("DELETE", "certificates/" + c["id"])
          print(f"revoked {len(old)}")
          PY

      - name: Archive
        run: |
          xcodebuild archive -project Slam.xcodeproj -scheme Slam -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Slam.xcarchive \
            DEVELOPMENT_TEAM="$TEAMID" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$PWD/build/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" > build/archive.log 2>&1 \
            || { grep -E "error:" -A3 build/archive.log | head -200; tail -40 build/archive.log; exit 1; }

      - name: Upload to TestFlight
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAMID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/Slam.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$PWD/build/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Remove key
        if: always()
        run: rm -f build/AuthKey.p8
