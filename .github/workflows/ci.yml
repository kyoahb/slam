name: Build and screenshots

on:
  workflow_dispatch:
    inputs:
      screens:
        description: Screens to shoot, blank for all (fresh-<name> for an empty install)
        default: ""
      devices:
        description: Which phones
        type: choice
        options: [both, small, large]
        default: both

concurrency:
  group: ci
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Pick simulators
        env:
          DEVICES: ${{ inputs.devices || 'both' }}
        run: |
          mkdir -p build
          python3 - <<'PY' > build/sims
          import json, subprocess
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          runtimes = sorted((k for k in data["devices"] if ".iOS-" in k),
                            key=lambda k: [int(x) for x in k.rsplit(".iOS-", 1)[1].split("-")])
          import os
          names = {"small": ["iPhone 17e"], "large": ["iPhone 17 Pro Max"]}.get(os.environ["DEVICES"], ["iPhone 17e", "iPhone 17 Pro Max"])
          for name in names:
              udid = next(d["udid"] for k in reversed(runtimes) for d in data["devices"][k] if d["name"] == name)
              print(udid, name.replace(" ", "-"))
          PY
          cat build/sims

      - name: Generate project
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate

      - name: Build
        run: |
          if ! xcodebuild build -project Slam.xcodeproj -scheme Slam \
              -destination "generic/platform=iOS Simulator" ARCHS=arm64 \
              -derivedDataPath build/dd COMPILER_INDEX_STORE_ENABLE=NO \
              OTHER_SWIFT_FLAGS='$(inherited) -Xfrontend -warn-long-expression-type-checking=200 -Xfrontend -warn-long-function-bodies=300' \
              > build/build.log 2>&1; then
            grep -E "error:" -A3 build/build.log | head -300
            exit 1
          fi
          grep -cE "warning:" build/build.log || true
          # Anything slow to type-check, which is what stretches the build.
          grep -E "to type-check" build/build.log | sed 's|.*/Slam/|Slam/|' | sort -u | head -40 || true

      - name: Screenshots
        env:
          SCREENS: ${{ inputs.screens || 'routines workout weight reps record rest live watch save history-sheet picker form routine history detail profile stats volume exercises exercise calendar photos settings fresh-history fresh-profile fresh-stats fresh-volume fresh-calendar fresh-exercise' }}
        run: |
          mkdir -p shots
          # Simulator commands can hang on a busy runner, so each gets a time limit.
          limit() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          # One launch per screen; the app writes tmp/demo-ready once the screen has settled.
          snap() {
            id=$1; ready=$2; f=$3; shift 3
            rm -f "$ready"
            if ! limit 60 xcrun simctl launch --terminate-running-process "$id" com.kyoahb.slam -demo "$@" > /dev/null; then
              echo "launch failed: $f"
              limit 60 xcrun simctl spawn "$id" log show --last 2m --style compact \
                --predicate 'process == "Slam" OR eventMessage CONTAINS[c] "com.kyoahb.slam"' 2>&1 | tail -25
            fi
            for _ in $(seq 60); do [ -f "$ready" ] && break; sleep 0.5; done
            [ -f "$ready" ] || echo "not ready: $f"
            limit 30 xcrun simctl io "$id" screenshot "$f" > /dev/null 2>&1 ||
              limit 30 xcrun simctl io "$id" screenshot "$f" > /dev/null 2>&1 || echo "no screenshot: $f"
          }
          shoot() {
            id=$1; dev=$2
            echo "$(date +%T) $dev: booting"
            limit 300 xcrun simctl boot "$id" || echo "$dev: boot command failed"
            if ! limit 600 xcrun simctl bootstatus "$id" > "build/boot-$dev.log" 2>&1; then
              echo "$dev: boot stalled"; tail -5 "build/boot-$dev.log"; exit 1
            fi
            echo "$(date +%T) $dev: booted"
            xcrun simctl status_bar "$id" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularMode notSupported
            limit 180 xcrun simctl install "$id" build/dd/Build/Products/Debug-iphonesimulator/Slam.app
            ready="$(xcrun simctl get_app_container "$id" com.kyoahb.slam data)/tmp/demo-ready"
            echo "$(date +%T) $dev: shooting"
            for s in $SCREENS; do
              case $s in
                fresh-*) snap "$id" "$ready" "shots/$dev-$s.png" -fresh -screen "${s#fresh-}" ;;
                *) snap "$id" "$ready" "shots/$dev-$s.png" -screen "$s" ;;
              esac
            done
            echo "$(date +%T) $dev: done"
          }
          pids=()
          while read -r id dev; do shoot "$id" "$dev" & pids+=($!); done < build/sims
          for p in "${pids[@]}"; do wait "$p"; done
          ls -l shots

      - name: Crash reports
        if: always()
        run: |
          for f in ~/Library/Logs/DiagnosticReports/Slam*.ips; do
            [ -f "$f" ] || continue
            echo "== $f"
            python3 - "$f" <<'PY'
          import json, sys
          r = json.loads(open(sys.argv[1]).read().partition("\n")[2])
          print(json.dumps(r.get("exception")), json.dumps(r.get("termination"))[:600])
          print(json.dumps(r.get("asi"))[:1500])
          images = r.get("usedImages", [])
          thread = next((t for t in r.get("threads", []) if t.get("triggered")), {})
          for fr in (r.get("lastExceptionBacktrace") or thread.get("frames", []))[:30]:
              i = fr.get("imageIndex")
              name = images[i].get("name", "?") if i is not None and i < len(images) else "?"
              print(" ", name, fr.get("symbol", ""), fr.get("symbolLocation", ""))
          PY
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/*.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build/build.log
          if-no-files-found: ignore
