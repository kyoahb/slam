name: Build and screenshots

on:
  workflow_dispatch:

concurrency:
  group: ci
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Boot simulators
        run: |
          mkdir -p build
          python3 - <<'PY' > build/sims
          import json, subprocess
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          runtimes = sorted((k for k in data["devices"] if ".iOS-" in k),
                            key=lambda k: [int(x) for x in k.rsplit(".iOS-", 1)[1].split("-")])
          for name in ["iPhone 17e", "iPhone 17 Pro Max"]:
              udid = next(d["udid"] for k in reversed(runtimes) for d in data["devices"][k] if d["name"] == name)
              print(udid)
          PY
          cat build/sims
          for id in $(cat build/sims); do nohup xcrun simctl boot "$id" > /dev/null 2>&1 & done

      - name: Generate project
        run: brew install xcodegen && xcodegen generate

      - name: Build
        run: |
          if ! xcodebuild build-for-testing -project Slam.xcodeproj -scheme Slam \
              -destination "id=$(head -1 build/sims)" \
              -derivedDataPath build/dd > build/build.log 2>&1; then
            grep -E "error:" -A3 build/build.log | head -300
            exit 1
          fi
          grep -cE "warning:" build/build.log || true

      - name: Screenshots
        run: |
          set -o pipefail
          dest=()
          for id in $(cat build/sims); do xcrun simctl bootstatus "$id" -b > /dev/null; dest+=(-destination "id=$id"); done
          xcodebuild test-without-building -project Slam.xcodeproj -scheme Slam -derivedDataPath build/dd \
            "${dest[@]}" \
            -resultBundlePath build/Shots.xcresult 2>&1 | grep -E "Test (Case|Suite)|error|failed|passed" | tail -60

      - name: Export screenshots
        if: always()
        run: |
          [ -d build/Shots.xcresult ] || exit 0
          xcrun xcresulttool export attachments --path build/Shots.xcresult --output-path shots
          python3 - <<'PY'
          import json, os, re
          d = "shots"
          for test in json.load(open(os.path.join(d, "manifest.json"))):
              for a in test.get("attachments", []):
                  name = a.get("suggestedHumanReadableName") or a["exportedFileName"]
                  name = re.sub(r"_\d+_[0-9A-Fa-f-]{36}", "", name)
                  name = re.sub(r"[^A-Za-z0-9.]+", "-", name)
                  os.rename(os.path.join(d, a["exportedFileName"]), os.path.join(d, name))
          PY
          ls shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/*.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build/build.log
          if-no-files-found: ignore
