name: Build and screenshots

on:
  workflow_dispatch:

concurrency:
  group: ci
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Boot simulators
        run: |
          mkdir -p build
          python3 - <<'PY' > build/sims
          import json, subprocess
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          runtimes = sorted((k for k in data["devices"] if ".iOS-" in k),
                            key=lambda k: [int(x) for x in k.rsplit(".iOS-", 1)[1].split("-")])
          for name in ["iPhone 17e", "iPhone 17 Pro Max"]:
              udid = next(d["udid"] for k in reversed(runtimes) for d in data["devices"][k] if d["name"] == name)
              print(udid, name.replace(" ", "-"))
          PY
          cat build/sims
          while read -r id _; do nohup xcrun simctl boot "$id" > /dev/null 2>&1 & done < build/sims

      - name: Generate project
        run: brew install xcodegen && xcodegen generate

      - name: Build
        run: |
          if ! xcodebuild build -project Slam.xcodeproj -scheme Slam \
              -destination "id=$(head -1 build/sims | cut -d' ' -f1)" \
              -derivedDataPath build/dd COMPILER_INDEX_STORE_ENABLE=NO > build/build.log 2>&1; then
            grep -E "error:" -A3 build/build.log | head -300
            exit 1
          fi
          grep -cE "warning:" build/build.log || true

      - name: Screenshots
        run: |
          mkdir -p shots
          shoot() {
            id=$1; dev=$2
            xcrun simctl bootstatus "$id" -b > /dev/null
            xcrun simctl status_bar "$id" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularMode notSupported
            xcrun simctl install "$id" build/dd/Build/Products/Debug-iphonesimulator/Slam.app
            for s in routines workout weight reps rest save picker routine history detail profile stats exercises exercise calendar photos settings; do
              xcrun simctl launch --terminate-running-process "$id" com.kyoahb.slam -demo -screen "$s" > /dev/null
              f="shots/$dev-$s.png"; prev=0
              # Wait for a frame that is not black (about 50 KB) and has stopped changing.
              for _ in $(seq 20); do
                sleep 1.5
                xcrun simctl io "$id" screenshot "$f" > /dev/null 2>&1
                size=$(stat -f %z "$f")
                [ "$size" -gt 90000 ] && [ $(( (size - prev) * (size - prev) * 2500 )) -lt $(( size * size )) ] && break
                prev=$size
              done
            done
          }
          pids=()
          while read -r id dev; do shoot "$id" "$dev" & pids+=($!); done < build/sims
          for p in "${pids[@]}"; do wait "$p"; done
          ls -l shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/*.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build/build.log
          if-no-files-found: ignore
